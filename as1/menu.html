<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/menu.css">
</head>

<body>
    <div class="header">
        <div class="logo">
            <img class="logo-img" src="images/ramaliya-logo.png" alt="Logo">
            <span class="brand-name">ROMALIYA</span>
        </div>
        <div class="nav">
            <a href="#" class="nav-item">Home</a>
            <a href="#" class="nav-item active">Menu</a>
            <a href="#" class="nav-item">Order</a>
            <a href="#" class="nav-item">Promotion</a>
            <a href="#" class="nav-item">About Us</a>
            <a href="#" class="nav-item">Our Restaurant</a>
            <div class="nav-icon-item">
                <img src="images/order.png" alt="Order Icon" class="order-icon-img">
            </div>
            <div class="menu-icon-item">
                <img src="images/menu-icon 1.png" alt="Menu Icon" class="menu-icon-img">
            </div>
        </div>
    </div>

    <div class="menu-hero">
        <div class="menu-hero-content">
            <div class="sub-heading">CHEF 'S</div>
            <h1>RECOMMENDATION</h1>
        </div>
    </div>

    <div class="recommendation-cards">
        <div class="card">
            <img src="images/lobster.jpeg" alt="Butter-Poached Lobster">
            <h4>BUTTER-POACHED LOBSTER</h4>
        </div>
        <div class="card">
            <img src="images/choco-cake.png" alt="Chocolate Ball On Cake">
            <h4>CHOCOLATE BALL ON CAKE</h4>
        </div>
        <div class="card">
            <img src="images/duck-meat.png" alt="Duck Breast With Cherry Sauce">
            <h4>DUCK BREAST WITH CHERRY SAUCE</h4>
        </div>
    </div>







</body>

</html>
