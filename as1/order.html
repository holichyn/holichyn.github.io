<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/order.css">
</head>

<body>
    <div class="header">
        <div class="logo">
            <img class="logo-img" src="images/ramaliya-logo.png" alt="Logo">
            <span class="brand-name">ROMALIYA</span>
        </div>
        <div class="nav">
            <a href="#" class="nav-item">Home</a>
            <a href="#" class="nav-item">Menu</a>
            <a href="#" class="nav-item active">Order</a>
            <a href="#" class="nav-item">Promotion</a>
            <a href="#" class="nav-item">About Us</a>
            <a href="#" class="nav-item">Our Restaurant</a>
            <div class="nav-icon-item">
                <img src="images/order.png" alt="Order Icon" class="order-icon-img">
            </div>
            <div class="menu-icon-item">
                <img src="images/menu-icon 1.png" alt="Menu Icon" class="menu-icon-img">
            </div>
        </div>
    </div>

    <div class="order-hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <p class="sub-heading">ROMALIYA TAKEOUT</p>
            <h2>ORDER ONLINE</h2>
        </div>
    </div>

    <div class="order-intro">
        <div class="intro-left">
            <p class="sub-heading">FROM OUR KITCHEN TO YOUR TABLE</p>
            <h4>CHOOSE YOUR FAVOURITES</h4>
            <p class="intro-desc">
                Select a quantity, add your dishes to the cart, then review everything before checkout.
            </p>
        </div>
        <div class="btn btn-outline">VIEW CART</div>
    </div>
</body>

</html>
